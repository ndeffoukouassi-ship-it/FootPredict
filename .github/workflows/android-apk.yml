name: Build FootPredict Android APK
on:
  push:
    branches: [feature/android-apk]
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile installable APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: FootPredict-V11-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
