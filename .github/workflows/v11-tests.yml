name: FootPredict V11 tests
on:
  push:
    branches: [feature/footpredict-v11]
  pull_request:
    branches: [main]
jobs:
  test-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run prediction engine regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
